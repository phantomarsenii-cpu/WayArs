# Migrated off the AGP 9 compatibility opt-outs (android.newDsl=false /
# android.builtInKotlin=false) that used to live here. The project now uses
# the new AGP DSL and AGP's built-in Kotlin support directly — see the
# comments in build.gradle.kts and app/build.gradle.kts for what changed —
# so there's nothing left to opt out of before AGP 10.0 removes those flags.
