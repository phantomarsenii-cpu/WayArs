org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Migrated off the AGP 9 compatibility opt-outs (android.newDsl=false /
# android.builtInKotlin=false) that used to live here. The project now uses
# the new AGP DSL and AGP's built-in Kotlin support directly — see the
# comments in build.gradle.kts and app/build.gradle.kts for what changed —
# so there's nothing left to opt out of before AGP 10.0 removes those flags.

# NOT a migration opt-out: this suppresses a separate, still-open bug in the
# KSP Gradle plugin itself (google/ksp#2729). KSP registers its generated
# source dirs (build/generated/ksp/<variant>/{kotlin,java}) via the legacy
# kotlin.sourceSets DSL, which AGP's built-in Kotlin rejects outright
# ("Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
# built-in Kotlin"). This has nothing to do with our own build scripts —
# it fires while KSP wires up its own generated sources, before our code
# runs. android.disallowKotlinSourceSets=false is the suppression Google's
# own error message points to; remove this once KSP ships a built-in-Kotlin
# fix that stops using kotlin.sourceSets internally.
android.disallowKotlinSourceSets=false
