org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Temporary AGP 9 compatibility opt-outs ---
# AGP 9.0 (needed for compileSdk/targetSdk 36) ships a new DSL by default and
# removes the OLD variant API — but app/build.gradle.kts still uses that old
# API directly (applicationVariants.all { ... BaseVariantOutputImpl ... }, to
# rename the output APK to WayArs.apk). android.newDsl=false keeps that old
# API available so that block keeps working unchanged.
# AGP 9.0 also enables built-in Kotlin support by default, which is NOT
# compatible with the classic org.jetbrains.kotlin.android plugin this
# project still applies in build.gradle.kts. android.builtInKotlin=false
# keeps using that classic plugin instead (builtInKotlin=false requires
# newDsl=false alongside it — the two are coupled).
# Google documents both flags as valid until AGP 10.0 (expected ~mid/late
# 2026) — remove them (and migrate to the new DSL / built-in Kotlin) before
# then, or the build will start failing again once AGP 10 drops them.
android.newDsl=false
android.builtInKotlin=false
