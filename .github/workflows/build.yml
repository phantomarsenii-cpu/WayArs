name: Build APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Actions does not allow the `secrets` context inside `if:`
    # conditions anywhere (job or step level) — that's the "Unrecognized
    # named-value: 'secrets'" parse error. Fix: copy the secret into a
    # job-level env var (env: at this level CAN read secrets), then check
    # env.X instead of secrets.X in every if: below — env IS allowed there.
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WayArs-debug-apk
          # Wildcard, not the exact filename, so a rename/AGP output-path
          # change doesn't turn into a silent "file not found" upload step.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release AAB + APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Both outputs built in one invocation: bundleRelease -> .aab
        # (Play Store upload format), assembleRelease -> .apk (direct
        # install / sideload / QA).
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace --no-build-cache

      - name: Upload signed release AAB
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WayArs-release-aab
          # Universal glob (not a hardcoded "app-release.aab"-style name)
          # so this step survives applicationId/versionName-based renames.
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WayArs-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
