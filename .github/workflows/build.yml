name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WayArs
          path: app/build/outputs/apk/debug/WayArs.apk

      # Release signing is entirely optional: only runs (and only if it
      # actually decodes something) when RELEASE_KEYSTORE_BASE64 is set as a
      # repo secret. Forks / PR builds without that secret configured just
      # skip straight past this and the release steps below quietly produce
      # nothing extra — the debug build above still succeeds either way.
      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release AAB + APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        # KEY_STORE_PATH is deliberately not set here: app/build.gradle.kts
        # defaults it to "release.keystore", resolved relative to the :app
        # module directory — which is exactly where the decode step above
        # wrote it (repo-root-relative "app/release.keystore" IS
        # app/'s "release.keystore"). Setting it to "app/release.keystore"
        # here would double up the "app/" segment and point at the wrong file.
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace --no-build-cache

      - name: Upload signed AAB
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WayArs-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WayArs-release-apk
          path: app/build/outputs/apk/release/*.apk
